<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Munim — Shop Manager</title>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Apply the persisted accent theme + light/dark mode BEFORE first paint
      // (React re-applies the same values on mount). Without this the app
      // flashes the default amber theme on startup until Settings mounts.
      (function () {
        try {
          var t = localStorage.getItem("munim-desktop-accent-theme");
          if (t && ["apple", "ocean", "forest", "rose", "midnight"].indexOf(t) > -1) {
            document.documentElement.setAttribute("data-theme", t);
          }
          var m = localStorage.getItem("munim-desktop-theme-mode");
          var dark =
            m === "dark" ||
            ((m === null || m === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
