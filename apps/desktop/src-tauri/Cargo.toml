[package]
name = "munim"
version = "0.1.0"
description = "Munim — shop management for stock, billing & khata"
authors = ["Munim"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "munim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
# `cookies` (default) makes plugin setup persist a cookie jar under
# app_cache_dir, which panics with "Access is denied" in sandboxed profiles.
# Munim authenticates with an API key, so the jar is unnecessary.
tauri-plugin-http = { version = "2.6", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
    "system-proxy",
] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Win32 print spooler access — raw TSPL2 label printing to thermal printers.
# Win32_Graphics_Gdi is required: PRINTER_DEFAULTSW/OpenPrinterW embed a Gdi
# DEVMODEW pointer, so windows-rs gates them behind that feature.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi"] }
