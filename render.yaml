services:
  - type: web
    name: munim-api
    runtime: node
    rootDir: .
    plan: free
    buildCommand: pnpm --filter @munim/api build
    startCommand: cd apps/api && pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: API_KEY_WEB
        sync: false
      - key: API_KEY_DESKTOP
        sync: false
      - key: API_KEY_MOBILE
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
