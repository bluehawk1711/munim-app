name: Desktop Build (Tauri)

on:
  # Manual only — a new installer is only needed when the native layer or
  # bundled JS changes (e.g. adding a Tauri plugin). Trigger via Actions →
  # "Run workflow". A push to main does NOT build a new installer.
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS / ubuntu can be added later (note: ubuntu needs
        # libwebkit2gtk-4.1-dev + libappindicator dev packages).
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Fail fast when the build-time secrets the app needs are not configured.
      # Required: VITE_API_URL + VITE_API_KEY — the installed app uses them to
      # reach the API without onboarding. Optional: the Cloudinary fallback vars
      # (VITE_CLOUDINARY_*) — image uploads still work through the API.
      - name: Verify required build secrets
        if: ${{ secrets.VITE_API_URL == '' || secrets.VITE_API_KEY == '' }}
        run: |
          echo "::error::Desktop build requires these GitHub secrets (Settings → Secrets and variables → Actions):"
          echo "::error::  VITE_API_URL   — deployed Munim API base URL"
          echo "::error::  VITE_API_KEY   — desktop platform key"
          echo "::error::Optional (direct Cloudinary upload fallback):"
          echo "::error::  VITE_CLOUDINARY_CLOUD_NAME, VITE_CLOUDINARY_UPLOAD_PRESET"
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Consumers import @munim/core from its dist/ — build it before the app.
      - name: Build shared core
        run: pnpm --filter @munim/core build

      # Build-time env — bake the API URL/key and the Cloudinary UNSIGNED
      # upload preset into the installer. VITE_* vars are inlined by Vite;
      # the app then works without onboarding when the API is deployed.
      # (Create the matching secrets in Settings → Secrets and variables.)
      - name: Build Tauri app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Munim v__VERSION__"
          releaseBody: "Automated desktop build from GitHub Actions."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: munim-desktop-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
