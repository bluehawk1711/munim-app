name: Web Typecheck & Build

on:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
       

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared core
        run: pnpm --filter @munim/core build

      - name: Typecheck
        run: pnpm --filter @munim/web typecheck

      - name: Build
        run: pnpm --filter @munim/web build
