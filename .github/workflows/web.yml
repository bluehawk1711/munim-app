name: Web Typecheck & Build

on:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
       

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Consumers import the shared packages (@munim/core, @munim/api-client,
      # @munim/query, @munim/store, @munim/ui, @munim/theme) from their dist/ —
      # build the whole upstream graph (turbo `^` = dependencies only, not the
      # app itself).
      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@munim/web^

      - name: Typecheck
        run: pnpm --filter @munim/web typecheck

      - name: Build
        run: pnpm --filter @munim/web build
