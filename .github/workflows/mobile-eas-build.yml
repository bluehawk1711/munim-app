name: Mobile Build (EAS — Android dev build)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "development"
        type: choice
        options: ["development", "preview", "release"]
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/core/**"]

jobs:
  eas-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared core
        run: pnpm --filter @munim/core build

      # `eas build` cannot prompt in --non-interactive mode, so the project must
      # be linked first. --idempotent makes this a no-op once app.json carries
      # extra.eas.projectId. Requires the EXPO_TOKEN secret (Expo account).
      - name: Link EAS project
        working-directory: apps/mobile
        run: eas init --non-interactive --idempotent

      - name: EAS Android build
        working-directory: apps/mobile
        env:
          EAS_PROFILE: ${{ inputs.profile || 'development' }}
        run: |
          eas build --platform android --profile "$EAS_PROFILE" --non-interactive --no-wait --json > eas-build.json
          node -e "const b=require('./eas-build.json'); const build=Array.isArray(b)?b[0]:b; const id=build?.id ?? 'unknown'; console.log('::notice::EAS build queued (id: '+id+'). Track it in the Expo dashboard.');"
